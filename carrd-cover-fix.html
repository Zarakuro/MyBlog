<!-- In Carrd als Embed (Code / Hidden / Body End) nach dem Blog-Embed einfuegen. -->
<script>
(() => {
  let downloadNotice;
  let downloadNoticeTimeout;

  function showDownloadNotice() {
    if (!downloadNotice) {
      downloadNotice = document.createElement('div');
      downloadNotice.id = 'blog-download-notice';
      downloadNotice.setAttribute('role', 'status');
      downloadNotice.setAttribute('aria-live', 'polite');
      Object.assign(downloadNotice.style, {
        position: 'fixed',
        bottom: 'calc(24px + env(safe-area-inset-bottom, 0px))',
        left: '50%',
        transform: 'translateX(-50%)',
        width: 'max-content',
        maxWidth: 'calc(100vw - 32px)',
        boxSizing: 'border-box',
        padding: '14px 20px',
        borderRadius: '10px',
        backgroundColor: '#16465E',
        color: '#ffffff',
        boxShadow: '0 4px 20px rgba(0, 0, 0, 0.3)',
        fontFamily: 'sans-serif',
        fontSize: '15px',
        lineHeight: '1.5',
        textAlign: 'center',
        zIndex: '100001',
        pointerEvents: 'none',
      });
      document.body.appendChild(downloadNotice);
    }

    downloadNotice.hidden = false;
    downloadNotice.textContent = 'Bilder, die du herunterladen darfst, findest du im Bereich „Downloads“.';
    clearTimeout(downloadNoticeTimeout);
    downloadNoticeTimeout = setTimeout(() => {
      downloadNotice.hidden = true;
      downloadNotice.textContent = '';
    }, 5000);
  }

  // Delegate to document so this also covers images loaded on article changes.
  function protectArticleImage(event) {
    if (event.target instanceof Element && event.target.closest('#text85 img')) {
      event.preventDefault();
      showDownloadNotice();
    }
  }

  document.addEventListener('contextmenu', protectArticleImage, true);
  document.addEventListener('dragstart', protectArticleImage, true);

  function initBlogCoverFix() {
    const list = document.querySelector('#gallery04 ul');
    if (!list) return;

    function revealCovers() {
      for (const item of list.children) {
        const link = item.querySelector('a[href]');
        // Only touch generated blog cards, leaving Carrd's template alone.
        if (!link || !new URL(link.href, location.href).searchParams.has('slug')) continue;

        const image = item.querySelector('img');
        if (!image || !/^https?:\/\//i.test(image.getAttribute('src') || '')) continue;

        // Cloned Carrd elements retain the placeholder styles, but lose the
        // load listener that would normally make the image visible.
        image.removeAttribute('data-src');
        image.removeAttribute('data-srcset');
        image.removeAttribute('srcset');
        image.removeAttribute('sizes');
        image.style.opacity = '1';
        image.style.removeProperty('transition-property');
        image.style.removeProperty('transition-timing-function');
        image.style.removeProperty('transition-duration');

        const frame = image.closest('.frame');
        if (frame) {
          frame.classList.remove('deferred', 'loading');
          frame.style.backgroundImage = 'none';
        }
      }
    }

    // Pagination replaces the list items, so apply the fix after each render.
    new MutationObserver(revealCovers).observe(list, { childList: true });
    revealCovers();
  }

  function initBlogDates() {
    const embed = document.querySelector('script[src*="/pk-blog-embed@"][data-owner][data-repo]');
    const dateElement = document.getElementById(embed?.dataset.date || 'text84');
    const formatter = new Intl.DateTimeFormat('de-DE', {
      day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC',
    });

    function validDate(value) {
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const parsed = new Date(`${value}T00:00:00Z`);
      return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value;
    }

    function dateLabel(post) {
      if (!validDate(post.published_date) || !validDate(post.date)) return '';
      const published = formatter.format(new Date(`${post.published_date}T00:00:00Z`));
      let label = `Veröffentlicht am ${published}`;
      if (post.date > post.published_date) {
        const updated = formatter.format(new Date(`${post.date}T00:00:00Z`));
        label += ` · Aktualisiert am ${updated}`;
      }
      return label;
    }

    function updateDates() {
      // The external embed exposes the metadata generated by the GitHub Action.
      const posts = window.carrdBlog?.posts;
      if (!Array.isArray(posts)) return;
      const bySlug = new Map(posts.map(post => [post.slug, post]));

      const slug = new URL(location.href).searchParams.get('slug');
      const post = bySlug.get(slug);
      const author = dateElement?.querySelector('.blog-author');
      const label = post && dateLabel(post);
      if (!author || !label) return;

      let dates = dateElement.querySelector('.blog-dates');
      if (!dates) {
        dates = document.createElement('span');
        dates.className = 'blog-dates';
        // Replace only the embed's date text, preserving the author and avatar.
        for (const node of [...dateElement.childNodes]) {
          if (node.nodeType === Node.TEXT_NODE) node.remove();
        }
        dateElement.insertBefore(dates, author);
        dateElement.style.flexWrap = 'wrap';
      }
      if (dates.textContent !== label) dates.textContent = label;
    }

    const observer = new MutationObserver(updateDates);
    if (dateElement) observer.observe(dateElement, { childList: true });
    updateDates();
  }

  function initBlogExtras() {
    initBlogCoverFix();
    initBlogDates();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBlogExtras, { once: true });
  } else {
    initBlogExtras();
  }
})();
</script>
