<!-- In Carrd: Embed / Code / Hidden / Body End. blog-enhancements.js zuerst zu GitHub hochladen. -->
<script>
(async () => {
  if (window.__zarakuroBlogLoading) return;
  window.__zarakuroBlogLoading = true;
  try {
    const url = 'https://raw.githubusercontent.com/Zarakuro/MyBlog/main/blog-enhancements.js?v=' + Date.now();
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error('Blog-Zusatz konnte nicht geladen werden: HTTP ' + response.status);
    const script = document.createElement('script');
    script.textContent = await response.text();
    document.body.appendChild(script);
  } catch (error) {
    window.__zarakuroBlogLoading = false;
    console.error('Carrd Blog: Zusatz fehlt. Bitte blog-enhancements.js im Repository pr?fen.', error);
  }
})();
</script>
